
services:
  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: front
    ports:
      - "80:80"
    depends_on:
      - back
    restart: always

  back:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: back
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: busbooking
      DB_USER: busadmin
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_DATABASE: busbooking
      MYSQL_USER: busadmin
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./terraform/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  mysql_data:
