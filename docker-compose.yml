
services:
  db:
    image: mysql:8.0
    container_name: bus-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: busbooking
      MYSQL_USER: busadmin
      MYSQL_PASSWORD: buspassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - bus-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - admin.env
    environment:
      DB_HOST: db
      DB_USER: busadmin
      DB_PASSWORD: buspassword
      DB_NAME: busbooking
      DB_PORT: "3306"
      SECRET_KEY: "replace-with-a-long-random-secret"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bus-network

volumes:
  mysql_data:

networks:
  bus-network:
    driver: bridge
